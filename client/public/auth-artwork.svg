<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#06050c"/>
      <stop offset="0.48" stop-color="#0d0820"/>
      <stop offset="1" stop-color="#04030a"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#0a0f2e"/>
      <stop offset="0.26" stop-color="#163a8f"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="0.78" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>

    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#120a2e"/>
      <stop offset="0.3" stop-color="#4c1d95"/>
      <stop offset="0.6" stop-color="#7c3aed"/>
      <stop offset="0.84" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#d8b4fe"/>
    </linearGradient>

    <linearGradient id="magenta" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#2a0726"/>
      <stop offset="0.28" stop-color="#8b0f6f"/>
      <stop offset="0.58" stop-color="#d61fa8"/>
      <stop offset="0.82" stop-color="#ff5fb2"/>
      <stop offset="1" stop-color="#ffb3da"/>
    </linearGradient>

    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0.32">
      <stop offset="0" stop-color="#1b0730"/>
      <stop offset="0.3" stop-color="#7e1063"/>
      <stop offset="0.62" stop-color="#db2777"/>
      <stop offset="0.86" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#fecdd3"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#ff9ed2"/>
      <stop offset="0.45" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>

    <linearGradient id="edgeSoft" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#f0abfc" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowPink">
      <stop offset="0" stop-color="#ff2fb3" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#c026d3" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#c026d3" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowViolet">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#6d28d9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBlue">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#2563eb" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>

    <filter id="softSmall" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>

    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030208" stop-opacity="0.55"/>
      <stop offset="0.3" stop-color="#030208" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#030208" stop-opacity="0"/>
      <stop offset="1" stop-color="#030208" stop-opacity="0.62"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1500" fill="url(#bg)"/>

  <!-- Luminous atmosphere -->
  <g filter="url(#soft)">
    <ellipse cx="150" cy="270" rx="380" ry="320" fill="url(#glowPink)"/>
    <ellipse cx="1020" cy="440" rx="420" ry="360" fill="url(#glowViolet)"/>
    <ellipse cx="910" cy="1180" rx="460" ry="400" fill="url(#glowBlue)"/>
    <ellipse cx="330" cy="960" rx="300" ry="260" fill="url(#glowPink)" opacity="0.7"/>
  </g>

  <!-- Upper ribbons -->
  <g fill="none" stroke-linecap="round">
    <path d="M-160 690 C 130 380 370 640 660 430 C 880 275 1040 300 1340 105"
          stroke="url(#edge)" stroke-width="110" opacity="0.16" filter="url(#softSmall)"/>
    <path d="M-160 700 C 150 415 395 660 690 455 C 915 300 1070 325 1340 135"
          stroke="url(#edge)" stroke-width="2.5" opacity="0.55"/>
    <path d="M-160 760 C 165 490 415 715 720 520 C 940 385 1090 400 1340 220"
          stroke="url(#edgeSoft)" stroke-width="1.2" opacity="0.6"/>
    <path d="M-160 610 C 120 340 360 580 630 385 C 840 235 990 250 1290 70"
          stroke="#f5d0fe" stroke-width="1" opacity="0.18"/>
  </g>

  <!-- Deep blue wave -->
  <g>
    <path d="M-80 850 C 200 620 400 905 690 715 C 925 562 1080 630 1280 495 L1280 1580 L-80 1580 Z"
          fill="url(#blue)" opacity="0.9"/>
    <path d="M-80 850 C 200 620 400 905 690 715 C 925 562 1080 630 1280 495"
          fill="none" stroke="url(#edge)" stroke-width="18" opacity="0.28" filter="url(#softSmall)"/>
    <path d="M-80 850 C 200 620 400 905 690 715 C 925 562 1080 630 1280 495"
          fill="none" stroke="#bae6fd" stroke-width="1.4" opacity="0.5"/>
  </g>

  <!-- Violet wave -->
  <g>
    <path d="M-80 1010 C 220 775 440 1050 735 855 C 960 708 1100 775 1280 655 L1280 1580 L-80 1580 Z"
          fill="url(#violet)" opacity="0.94"/>
    <path d="M-80 1010 C 220 775 440 1050 735 855 C 960 708 1100 775 1280 655"
          fill="none" stroke="url(#edge)" stroke-width="22" opacity="0.26" filter="url(#softSmall)"/>
    <path d="M-80 1010 C 220 775 440 1050 735 855 C 960 708 1100 775 1280 655"
          fill="none" stroke="#e9d5ff" stroke-width="1.6" opacity="0.55"/>
  </g>

  <!-- Magenta wave -->
  <g>
    <path d="M-80 1185 C 240 960 490 1230 790 1030 C 1000 890 1120 940 1280 840 L1280 1580 L-80 1580 Z"
          fill="url(#magenta)" opacity="0.94"/>
    <path d="M-80 1185 C 240 960 490 1230 790 1030 C 1000 890 1120 940 1280 840"
          fill="none" stroke="url(#edge)" stroke-width="24" opacity="0.3" filter="url(#softSmall)"/>
    <path d="M-80 1185 C 240 960 490 1230 790 1030 C 1000 890 1120 940 1280 840"
          fill="none" stroke="#ffe4f1" stroke-width="1.7" opacity="0.6"/>
  </g>

  <!-- Rose wave, lower right -->
  <g>
    <path d="M-80 1345 C 280 1145 540 1405 840 1195 C 1020 1065 1140 1110 1280 1030 L1280 1580 L-80 1580 Z"
          fill="url(#hot)" opacity="0.82"/>
    <path d="M-80 1345 C 280 1145 540 1405 840 1195 C 1020 1065 1140 1110 1280 1030"
          fill="none" stroke="#fecdd3" stroke-width="1.4" opacity="0.38"/>
  </g>

  <!-- Fine contour lines -->
  <g fill="none" stroke="#e0f2fe" stroke-width="1" opacity="0.13">
    <path d="M-60 920 C 220 700 415 975 700 785 C 930 632 1080 700 1290 560"/>
    <path d="M-60 955 C 225 740 420 1010 705 820 C 935 665 1085 730 1290 590"/>
    <path d="M-60 1080 C 240 850 455 1125 750 930 C 975 782 1115 845 1290 725"/>
    <path d="M-60 1240 C 255 1030 505 1290 805 1090 C 1010 955 1130 1000 1290 905"/>
    <path d="M-60 1410 C 290 1215 550 1460 850 1255 C 1030 1130 1150 1170 1290 1090"/>
  </g>

  <!-- Sweeping light arc -->
  <g fill="none" stroke-linecap="round">
    <path d="M180 1580 C 110 1270 380 1030 690 1160 C 930 1260 1090 1210 1300 1040"
          stroke="url(#edge)" stroke-width="40" opacity="0.14" filter="url(#softSmall)"/>
    <path d="M180 1580 C 110 1270 380 1030 690 1160 C 930 1260 1090 1210 1300 1040"
          stroke="#fdf2f8" stroke-width="1.6" opacity="0.42"/>
    <path d="M-80 500 C 140 430 260 500 390 430" stroke="#f5d0fe" stroke-width="1" opacity="0.3"/>
  </g>

  <rect width="1200" height="1500" fill="url(#vignette)"/>
</svg>
