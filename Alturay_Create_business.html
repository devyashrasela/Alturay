<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alturay · Create a business</title>
<style>
:root{color-scheme:dark;--bg:#000;--card:#0c0c0c;--row:#0a0a0a;--tile:#171717;--border:#2b2b2b;--grid:#3a3a3a;--hover:#161616;--text:#f5f5f5;--text-2:#b0b0b0;--muted:#8a8a8a;--ring:rgba(59,127,219,.4);
  --font:'Mona Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
@media (prefers-color-scheme:light){:root{color-scheme:light;--bg:#fff;--card:#fafafa;--row:#fff;--tile:#f1f1f3;--border:#e3e3e6;--grid:#d4d4d8;--hover:#f4f4f5;--text:#171717;--text-2:#52525b;--muted:#8b8b94}.lg{filter:invert(1)}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
.page{position:relative;min-height:100vh;overflow:hidden;display:flex;flex-direction:column}
body{background:var(--bg);color:var(--text);font:13px/1.4 var(--font);-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,a{font:inherit;color:inherit;cursor:pointer;background:none;border:0;text-decoration:none}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid #3B7FDB;outline-offset:2px}
.top{height:49px;display:flex;align-items:center;justify-content:space-between;padding:0 26px}
.brand{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:600;letter-spacing:-.01em}
.lg{width:32px;height:32px;object-fit:contain;display:block}
.tr{display:flex;align-items:center;gap:18px;color:var(--text-2)}
.tr a,.tr button{display:flex;align-items:center;gap:8px;height:30px;padding:0 6px;border-radius:8px;font-size:14px}
.tr a:hover,.tr button:hover{background:var(--hover);color:var(--text)}
.tr .i{width:18px;height:18px}
main{flex:1;display:grid;place-items:center;padding:24px 16px 73px}
.frame{position:relative;width:min(544px,100%);padding:26px}
.hl,.vl{position:absolute;pointer-events:none}
.hl{left:-300vw;right:-300vw;border-top:1px dashed var(--grid)}
.vl{top:-300vh;bottom:-300vh;border-left:1px dashed var(--grid)}
.hl.t{top:0}.hl.b{bottom:0}.vl.l{left:0}.vl.r{right:0}
.hd{position:absolute;width:9px;height:9px;border:1px solid var(--grid);border-radius:2px;background:var(--bg)}
.hd.tl{top:-4px;left:-4px}.hd.tr{top:-4px;right:-4px}.hd.bl{bottom:-4px;left:-4px}.hd.br{bottom:-4px;right:-4px}
.lab{position:absolute;top:31px;right:calc(100% + 37px);font-size:15px;font-weight:500;white-space:nowrap}
.steps{position:absolute;top:31px;left:calc(100% + 25px);display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;white-space:nowrap}
.steps::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--text)}
.card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px}
.card h1{font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.card p.sub{color:var(--text-2);font-size:13.5px;margin-top:4px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.biz{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:0 16px;border:1px solid var(--border);border-radius:12px;background:var(--row);text-align:left;transition:background .12s,border-color .12s}
.biz:hover{background:var(--hover);border-color:var(--grid)}
.biz .tile{width:36px;height:36px;border-radius:9px;background:var(--tile);border:1px solid var(--border);display:grid;place-items:center;flex:none;font-size:15px;font-weight:600;color:var(--text-2)}
.biz .tile .lg{width:22px;height:22px}
.biz .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.biz b{font-size:14px;font-weight:600}
.biz small{font-size:12.5px;color:var(--muted)}
.biz .go{margin-left:auto;color:var(--muted)}
.biz:hover .go{color:var(--text)}
.biz.add{border-style:dashed;background:transparent;min-height:56px;color:var(--text-2);font-size:14px}
.biz.add:hover{color:var(--text);background:var(--hover)}
.out{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px auto 0;height:32px;padding:0 12px;border-radius:8px;color:var(--muted);font-size:13.5px}
.out:hover{color:var(--text);background:var(--hover)}
@media (max-width:1000px){.lab,.steps{display:none}.hl,.vl,.hd{display:none}.frame{padding:0}}
</style>
</head>
