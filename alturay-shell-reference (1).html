<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alturay · App shell reference</title>
<!--
  STATIC REFERENCE FOR THE AGENT. Build it as React components in client/src/components/layout/.

  SOURCE OF TRUTH: every color and size below was sampled/measured from the supplied screenshot
  (2940px wide @2x, so CSS px = image px / 2). No colors from the repo's index.css are used.
  Do NOT add new colors beyond --accent and --danger (sampled from the table references). Dark only (the screenshot has no light variant).

  COMPONENTS
    TopNav .............. .topbar       44px tall, no border. logo + wordmark | nav links | workspace switcher + avatar
    SecondarySidebar .... .sb           floating panel, 271px wide, top 58px, bottom 24px, right corners 12px.
                                        Shown only for Inventory, Billing, Settings (config in JS below = navConfig.js). Collapses to a rail, never hides.
    QuickActions ........ .fab + .qa    41px round button fixed bottom-right; opens a popup of create-actions
    Main content ........ .main         gets margin-left: 271px when the sidebar is visible

  SIDEBAR RAIL (new): the sidebar never disappears. `>>` in its header collapses it to a 52px icon-only rail
  (same panel surface, same position). The first rail button shows the SECTION icon (Inventory = box, Billing = receipt,
  Settings = sliders; config `sb.icon`) while the pointer is away, and swaps to `>>` (expand) when the pointer is over
  the rail or a rail button has keyboard focus; on touch devices it always shows `>>`. Clicking it expands the sidebar. Main content margin follows:
  271px expanded (body.has-sb) / 52px rail (body.has-rail). Rail contents = toggle, primary pill, then one
  icon per item with a thin divider between groups, and the CTA as a round icon button at the bottom.
  RailTooltip (new): in rail mode every icon shows a pill tooltip to its right on hover AND keyboard focus
  (label, optional shortcut chip via data-kbd, and a "Soon" chip for disabled items). One shared fixed-position
  element (#tip), so the sidebar's overflow never clips it. Rail icons keep aria-label = the same text.
  Disabled (`soon`) rail items use aria-disabled (not `disabled`) so they still receive hover/focus and show a tooltip.

  LOGO: topbar uses the real Alturay mark. Here it is inlined (cropped to the artwork and resized to 96px) so this
  file is self-contained. In the project use <img src="/alturay_light.png" width="22" height="22" alt="">; the
  source PNG has transparent padding around the mark, so crop it or size it ~30px to match this look.

  USER MENU (new): the topbar avatar opens a popup in the same style/position as the workspace switcher:
  user row, Settings, Help, Log out. Settings opens UserSettingsModal on "Profile"; Help opens it on "Help"; Log out is a
  placeholder (wire to sign-out). UserSettingsModal = centered dialog (role=dialog, aria-modal): left rail with a
  "Search settings" field (filters tabs) + Account tabs [Profile, Personalization, Help], right pane with title,
  description and a placeholder body (content to be defined). Close via X, Esc or backdrop; focus returns to the avatar.
  The Settings sidebar no longer has an Account group or Personalization page (those live in this modal).

  ICONS: the project uses Heroicons (https://heroicons.com, outline, 24px). Already mapped here:
  Inventory (section icon in the rail) = clipboard-document-list, Filter = funnel, date range = calendar-days, card menu = ellipsis-horizontal. The remaining icons in this file are
  placeholders; swap each for the closest Heroicon when building the real components.

  DASHBOARD (new): greeting + date-range/Filter buttons; 4 KPI cards in one bordered strip (Total revenue, Outstanding,
  Total invoices, Total products); Revenue overview = dot-matrix bar chart (1 dot = ₹5,000 per day; hovering or arrowing
  through a day solidifies its column and shows a dashed guide to a value badge on the y-axis and a date badge on the
  x-axis); Invoice status = donut (Draft, Issued, Paid, Cancelled) with legend; Recent invoices / bills table.
  Only existing theme colors: accent blue for revenue/Paid/Issued (tints via color-mix), --danger for Cancelled,
  --muted for Draft. All numbers are sample data (REV, STAT, INV, DOCS in the JS) to be replaced by real data.

  SIDEBAR MOUNT/UNMOUNT (new): going from a page without a sidebar (Dashboard, Customers) to one with it (Inventory,
  Billing, Settings) slides the sidebar in from the left while the content margin eases over (220ms); the reverse slides
  it out and then removes it. Switching between two sidebar sections just swaps its content. Disabled for
  prefers-reduced-motion. Exiting panel is `inert` so it can't take focus mid-animation.

  Behavior to keep: Esc / outside click closes popups (Esc also hides the tooltip); items with `soon` are disabled
  and show a "Soon" chip (existing project pattern).
-->
<style>
:root{
  /* sampled from the screenshot */
  --bg:#191919;          /* page + top bar */
  --panel:#202020;       /* sidebar + popups */
  --border:#383836;
  --hover:#2C2C2C;       /* active / hover fill (rows, pills, nav link) */
  --chip:#333332;
  --text:#F0EFED;        /* primary text */
  --text-2:#BCBAB6;      /* item text */
  --icon:#ACA9A4;
  --muted:#7C7A76;       /* labels, chevrons */
  --avatar:#71269C;
  --fab:#D3D3D3;
  --fab-icon:#020203;
  --accent:#3B7FDB;      /* primary button, sampled from the database reference */
  --danger:#E5645C;      /* delete icon, sampled from the products screenshot */
  --font-family:'Mona Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font-family);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--icon);outline-offset:2px}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.soon{margin-left:auto;padding:2px 6px;border-radius:6px;background:var(--chip);color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}

/* ── TopNav ── */
.topbar{position:sticky;top:0;z-index:50;height:44px;background:var(--bg);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;padding:0 12px;gap:16px}
.topbar__brand{display:flex;align-items:center;gap:14px;font-size:14px;font-weight:500;color:var(--text);justify-self:start}
.topbar__logo{width:22px;height:22px;object-fit:contain;display:block}
.topbar__links{display:flex;align-items:center;gap:2px}
.topbar__link{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:6px;color:var(--text-2);font-size:14px;font-weight:500;transition:background .12s,color .12s}
.topbar__link:hover{background:var(--hover);color:var(--text)}
.topbar__link[aria-current=page]{background:var(--hover);color:var(--text)}
.topbar__end{justify-self:end;display:flex;align-items:center;gap:8px}
.ws{position:relative}
.ws__btn{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px 0 6px;border-radius:6px;font-weight:500;color:var(--text)}
.ws__btn:hover,.ws__btn[aria-expanded=true]{background:var(--hover)}
.tile{width:20px;height:20px;border-radius:5px;background:var(--hover);color:var(--muted);display:grid;place-items:center;font-size:12px;font-weight:600;flex-shrink:0}
.ws__btn .ic{color:var(--muted)}
.avatar{width:24px;height:24px;border-radius:50%;background:var(--avatar);color:var(--text);display:grid;place-items:center;font-size:12px;font-weight:500}

/* shared popup surface */
.pop{position:absolute;z-index:60;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.pop[hidden]{display:none}
.pop__label{height:28px;padding:0 8px;display:flex;align-items:center;font-size:12px;font-weight:500;color:var(--muted)}
.pop__item{display:flex;align-items:center;gap:10px;width:100%;height:30px;padding:0 8px;border-radius:6px;color:var(--text-2)}
.pop__item .ic{color:var(--icon)}
.pop__item:hover:not(:disabled){background:var(--hover);color:var(--text)}
.pop__item:disabled{opacity:.55;cursor:default}
.pop__sep{height:1px;background:var(--hover);margin:6px 2px}
.ws .pop,.um .pop{top:34px;right:0;width:240px}
.um{position:relative}
.um .avatar{cursor:pointer}
.um .avatar:hover,.um .avatar[aria-expanded=true]{box-shadow:0 0 0 2px var(--hover)}
.pop__user{display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;color:var(--text);font-weight:500}
/* dashboard */
.dash-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.dash-tools{display:flex;gap:10px}
.dash-btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text)}
.dash-btn .ic{color:var(--icon)}
.dash-btn:hover{background:var(--hover)}
.dcard{background:var(--panel);border:1px solid var(--border);border-radius:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);margin-top:24px;overflow:hidden}
.kpi{padding:16px 20px 18px;min-width:0}
.kpi+.kpi{border-left:1px solid var(--border)}
.kpi__top,.dh{display:flex;align-items:center;justify-content:space-between}
.kpi__label{color:var(--text-2)}
.kpi__val{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:14px 0 8px}
.kpi__delta{font-size:13px;color:var(--muted)}
.kpi__delta b{font-weight:600;margin-right:6px;color:var(--accent)}
.kpi__delta b.neg{color:var(--danger)}
.dmore{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.dmore:hover{background:var(--hover);color:var(--text)}
.drow{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;margin-top:16px}
.dpad{padding:16px 20px 20px}
.dh h2{font-size:15px;font-weight:600}
.legend{display:flex;gap:16px;margin:10px 0 18px;color:var(--text-2);font-size:13px}
.legend i,.lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--accent)}
.rv-plot{position:relative;margin:0 0 34px 62px;aspect-ratio:760/300}
.rv-plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;touch-action:pan-y;outline:0}
.rv-plot svg:focus-visible{outline:2px solid var(--accent);outline-offset:6px;border-radius:6px}
.rv-grid{stroke:var(--border);stroke-dasharray:3 5}
.rv-dot{fill:color-mix(in srgb,var(--accent) 26%,transparent);transition:fill .12s}
.rv-dot.on{fill:var(--accent)}
.rv-dot.top{fill:color-mix(in srgb,var(--accent) 28%,var(--panel));stroke:color-mix(in srgb,var(--accent) 45%,transparent);stroke-width:4}
.rv-g{display:none}.rv-g.on{display:block}
.rv-guide{stroke:var(--accent);stroke-dasharray:2 5;stroke-linecap:round;stroke-width:1.5}
.rv-pt{fill:var(--accent)}
.rv-yl,.rv-xl{position:absolute;font-size:12px;color:var(--muted);white-space:nowrap;pointer-events:none}
.rv-yl{right:calc(100% + 12px);transform:translateY(-50%)}
.rv-xl{top:calc(100% + 12px);transform:translateX(-50%)}
.rv-b{position:absolute;display:none;padding:3px 8px;border-radius:6px;background:var(--accent);color:#fff;font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none;z-index:2}
.rv-b.on{display:block}
.rv-yb{right:calc(100% + 6px);transform:translateY(-50%)}
.rv-xb{top:calc(100% + 8px);transform:translateX(-50%)}
.dn{position:relative;width:200px;height:200px;margin:14px auto 12px}
.dn svg{width:100%;height:100%}
.dn-seg{fill:none;stroke-width:16;stroke-linecap:round;transition:stroke-width .12s}
.dn-seg:hover{stroke-width:20}
.dn-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.dn-c b{font-size:28px;font-weight:600;letter-spacing:-.02em}
.dn-c span{color:var(--muted);font-size:13px;margin-top:2px}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;color:var(--text-2)}
.lg div{display:flex;align-items:center}
.lg em{margin-left:auto;font-style:normal;color:var(--text);font-weight:500}
.lg i{margin-right:8px}
.dtbl{margin-top:16px;overflow:hidden}
.dtbl .db-wrap{margin:14px -20px -20px;border-radius:0 0 12px 12px}
.dtbl .db th{background:var(--hover)}
.dtbl .db th:first-child,.dtbl .db td:first-child{padding-left:20px}
.dtbl .db th:last-child,.dtbl .db td:last-child{padding-right:20px}
.dtbl .db tr:last-child td{border-bottom:0}
.sc{display:inline-block;padding:3px 9px;border-radius:6px;font-size:12px;font-weight:500}
.sc-draft{background:var(--chip);color:var(--text-2)}
.sc-issued{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.sc-paid{background:var(--accent);color:#fff}
.sc-cancelled{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:1100px){.drow{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.kpi:nth-child(odd){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--border)}}
@media (max-width:560px){.kpis{grid-template-columns:1fr}.kpi+.kpi{border-left:0;border-top:1px solid var(--border)}.rv-plot{margin-left:48px}.rv-yl{right:calc(100% + 6px)}}
/* user settings modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:24px}
.modal[hidden]{display:none}
.us{position:relative;display:grid;grid-template-columns:260px minmax(0,1fr);width:min(1040px,100%);height:min(680px,calc(100vh - 48px));background:var(--bg);border:1px solid var(--border);border-radius:14px;box-shadow:0 16px 48px rgba(0,0,0,.55);overflow:hidden}
.us__nav{background:var(--panel);padding:12px 8px;overflow:auto;display:flex;flex-direction:column;gap:6px}
#usList{display:flex;flex-direction:column;gap:4px}
.us__search{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;margin-bottom:16px;border:1px solid var(--border);border-radius:8px;color:var(--muted)}
.us__search:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.us__search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit}
.us__search input::placeholder{color:var(--muted)}
.us__label{height:28px;padding:0 8px;display:flex;align-items:center;font-size:12px;font-weight:500;color:var(--muted)}
.us__item{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;border-radius:6px;color:var(--text-2);text-align:left}
.us__item .ic{color:var(--icon)}
.us__item:hover{background:var(--hover);color:var(--text)}
.us__item[aria-selected=true]{background:var(--hover);color:var(--text)}
.us__none{padding:8px;color:var(--muted)}
.us__body{padding:56px clamp(24px,6vw,72px);overflow:auto}
.us__title{font-size:28px;font-weight:700;letter-spacing:-.02em}
.us__sub{margin-top:8px;color:var(--text-2);font-size:15px}
.us__empty{margin-top:32px;max-width:640px;border:1px dashed var(--border);border-radius:10px;padding:28px;color:var(--muted);text-align:center}
.us__close{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:50%;background:var(--hover);display:grid;place-items:center;color:var(--text-2)}
.us__close:hover{color:var(--text)}
@media (max-width:760px){.modal{padding:0}.us{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:100vh;border-radius:0;border:0}.us__nav{flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px}.us__search{width:100%}.us__label{display:none}.us__body{padding:24px 20px}}

/* ── SecondarySidebar ── */
.sb{position:fixed;left:0;top:58px;bottom:24px;width:271px;z-index:30;background:var(--panel);border:1px solid var(--border);border-left:0;border-radius:0 12px 12px 0;display:flex;flex-direction:column;padding:10px 8px 0}
.sb[hidden]{display:none}
.sb__head{display:flex;align-items:center;gap:8px;height:40px;padding:0 8px}
.sb__title{flex:1;font-size:14px;font-weight:600;color:var(--text)}
.sb__collapse{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.sb__collapse:hover{background:var(--hover);color:var(--text)}
.sb__quick{display:flex;height:32px;margin-top:10px}
.sb__pill{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 12px;border-radius:6px;font-size:14px;font-weight:600;color:var(--text-2)}
.sb__pill .ic{color:var(--icon)}
.sb__pill:hover:not(:disabled){background:var(--hover);color:var(--text)}
.sb__pill[aria-current=page]{background:var(--hover);color:var(--text)}
.sb__pill:disabled{opacity:.55;cursor:default}
.sb__scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding-top:6px}
.sb__scroll::-webkit-scrollbar{display:none}
.sb__group{margin-top:14px}
.sb__label{height:28px;padding:0 8px;display:flex;align-items:center;font-size:12px;font-weight:500;color:var(--muted)}
.sb__item{display:flex;align-items:center;gap:10px;width:100%;height:30px;margin-bottom:1px;padding:0 12px;border-radius:6px;color:var(--text-2)}
.sb__item .ic{color:var(--icon)}
.sb__item:hover:not(:disabled){background:var(--hover);color:var(--text)}
.sb__item[aria-current=page]{background:var(--hover);color:var(--text)}
.sb__item:disabled{opacity:.55;cursor:default}
.sb__foot{padding:8px 7px 17px}
.sb__cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:41px;border-radius:21px;background:var(--hover);color:var(--text-2);font-weight:500}
.sb__cta:hover{color:var(--text)}
.sb{transition:width .22s ease,transform .22s ease,opacity .22s ease}
.sb--out{transform:translateX(-100%);opacity:0;pointer-events:none}
/* collapsed rail */
.sb--rail{width:52px;padding:8px 7px 0;align-items:center}
.sb--rail .sb__scroll{width:100%;display:flex;flex-direction:column;align-items:center;padding-top:0}
.rl{width:36px;height:36px;margin-bottom:2px;border-radius:10px;display:grid;place-items:center;color:var(--icon);flex-shrink:0}
.rl:hover,.rl:focus-visible{background:var(--hover);color:var(--text)}
.rl[aria-current=page]{background:var(--hover);color:var(--text)}
.rl.is-soon{opacity:.55;cursor:default}
.rl.is-soon:hover{background:none;color:var(--icon)}
.rl-toggle>span{grid-area:1/1;display:grid;place-items:center;transition:opacity .12s}
.rl__exp{opacity:0}
.sb--rail:hover .rl__sec,.sb--rail:has(:focus-visible) .rl__sec{opacity:0}
.sb--rail:hover .rl__exp,.sb--rail:has(:focus-visible) .rl__exp{opacity:1}
@media (hover:none){.rl__sec{opacity:0}.rl__exp{opacity:1}}
.rl-sep{width:20px;height:1px;background:var(--border);margin:8px 0 10px}
.rl-foot{padding:8px 0 14px}
.rl-cta{background:var(--hover);border-radius:50%;color:var(--text-2)}
.rl-cta:hover{color:var(--text);background:var(--chip)}
/* rail tooltip */
.tip{position:fixed;z-index:90;display:flex;align-items:center;gap:10px;height:34px;padding:0 16px;border-radius:17px;background:var(--hover);border:1px solid var(--border);box-shadow:0 8px 24px rgba(0,0,0,.45);color:var(--text);font-size:14px;font-weight:600;white-space:nowrap;pointer-events:none;transform:translateY(-50%)}
.tip[hidden]{display:none}
.tip--chip{padding-right:6px}
.tip kbd{height:22px;padding:0 9px;border-radius:11px;background:var(--chip);color:var(--text-2);font:inherit;font-size:13px;display:grid;place-items:center}
.tip .soon{margin-left:0}

/* ── Main ── */
.main{padding:32px 40px 96px;transition:margin-left .22s ease}
.has-sb .main{margin-left:271px}
.has-rail .main{margin-left:52px}
.page-title{font-size:30px;font-weight:700;letter-spacing:-.02em;color:var(--text)}
.page-sub{margin-top:4px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:24px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
.card small{color:var(--muted);font-size:12px;font-weight:500}
.card b{display:block;margin-top:6px;font-size:24px;font-weight:600;color:var(--text)}
/* ── Database table (Products) ── */
.db-bar{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-top:20px}
.db-search{display:flex;align-items:center;gap:8px;height:32px;width:240px;padding:0 10px;border-radius:8px;color:var(--muted)}
.db-search:focus-within{background:var(--hover);box-shadow:0 0 0 1px var(--icon)}
.db-search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit}
.db-search input::placeholder{color:var(--muted)}
.db-end{margin-left:auto;display:flex;align-items:center;gap:12px}
.db-icon{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;color:var(--icon)}
.db-icon:hover{background:var(--hover);color:var(--text)}
.db-new{height:30px;padding:0 14px;border-radius:6px;background:var(--accent);color:#fff;font-weight:600}
.db-new:hover{filter:brightness(1.12)}
.db-wrap{margin-top:16px;overflow-x:auto}
.db{width:100%;min-width:720px;border-collapse:collapse;table-layout:fixed}
.db th{height:36px;padding:0 12px;text-align:left;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap;border-bottom:1px solid var(--border)}
.db td{height:37px;padding:0 12px;border-bottom:1px solid var(--border);color:var(--text-2)}
.db th:first-child,.db td:first-child{padding-left:14px}
.db td:first-child{color:var(--text);font-weight:500}
.db tbody tr:hover td{background:var(--panel)}
.db .num{text-align:right}
.db td.price{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.db td.tax{color:var(--muted);font-variant-numeric:tabular-nums}
.act{display:flex;justify-content:flex-end;gap:4px}
.act button{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--icon)}
.act button:hover{background:var(--hover);color:var(--text)}
.act .del,.act .del:hover{color:var(--danger)}

/* ── QuickActions ── */
.fab{position:fixed;right:15px;bottom:8px;z-index:70;width:41px;height:41px;border-radius:50%;background:var(--fab);border:1px solid var(--border);color:var(--fab-icon);display:grid;place-items:center}
.fab .ic{transition:transform .2s;stroke-width:2.2}
.fab[aria-expanded=true] .ic{transform:rotate(45deg)}
.qa{position:fixed;right:15px;bottom:58px;width:248px;z-index:70}

@media (max-width:1024px){
  .topbar__links{display:none}
  .topbar{grid-template-columns:1fr auto}
  .has-sb .main{margin-left:0}
  .main{padding:24px 16px 96px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .db-search{width:auto;flex:1;min-width:140px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

var sbTimer=null,reduceMotion=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
function renderSidebar(){

    return;
  }

  if(el.hidden){el.classList.add('sb--out');el.hidden=false;void el.offsetWidth} /* mount: start off-screen */

function initDash(){
  var svg=$('#rvSvg'),n=REV.length,s='',act=-1;
  [0,4,8,12].forEach(function(t){var y=t?cy(t-1):RH-12;s+='<line class="rv-grid" x1="0" x2="'+RW+'" y1="'+y+'" y2="'+y+'"/>'});
  s+='<g class="rv-g" id="rvG"><line class="rv-guide" id="rvH"/><line class="rv-guide" id="rvV"/><circle class="rv-pt" r="3" id="rvT2"/><circle class="rv-pt" r="3" id="rvE"/></g>';
  REV.forEach(function(v,i){for(var k=0;k<v;k++)s+='<circle class="rv-dot" data-i="'+i+'" data-k="'+k+'" cx="'+cx(i)+'" cy="'+cy(k)+'" r="'+DR+'"/>'});
  svg.innerHTML=s;
  function set(el,o){for(var a in o)el.setAttribute(a,o[a])}
  function clear(){
    if(act>-1)svg.querySelectorAll('[data-i="'+act+'"]').forEach(function(c){c.classList.remove('on','top')});
    $('#rvG').classList.remove('on');$('#rvYb').classList.remove('on');$('#rvXb').classList.remove('on');act=-1;
  }
  function show(i){
    if(i===act)return;clear();act=i;var v=REV[i],x=cx(i),y=cy(v-1);
    svg.querySelectorAll('[data-i="'+i+'"]').forEach(function(c){c.classList.add(+c.dataset.k===v-1?'top':'on')});
    set($('#rvH'),{x1:0,x2:x-14,y1:y,y2:y});set($('#rvV'),{x1:x,x2:x,y1:y+14,y2:RH-2});set($('#rvT2'),{cx:x,cy:y});set($('#rvE'),{cx:x,cy:RH-2});
    var yb=$('#rvYb'),xb=$('#rvXb');yb.textContent=inr(v*UNIT);yb.style.top=(y/RH*100)+'%';xb.textContent='Nov '+(i+1);xb.style.left=(x/RW*100)+'%';
    $('#rvG').classList.add('on');yb.classList.add('on');xb.classList.add('on');
    $('#rvLive').textContent='Nov '+(i+1)+': '+inr(v*UNIT);
  }
  svg.addEventListener('pointermove',function(e){var r=svg.getBoundingClientRect();show(Math.max(0,Math.min(n-1,Math.floor((e.clientX-r.left)/r.width*n))))});
  svg.addEventListener('pointerleave',clear);
  svg.addEventListener('blur',clear);
  svg.addEventListener('keydown',function(e){
    if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;e.preventDefault();
    show(act<0?(e.key==='ArrowLeft'?n-1:0):Math.max(0,Math.min(n-1,act+(e.key==='ArrowLeft'?-1:1))));
  });
}

}

});

  if(e.key==='Escape'){if(!$('#us').hidden)closeUS();closeAll();hideTip()}
  if(e.key==='Tab'&&!$('#us').hidden){ /* keep focus inside the modal */
    var f=$('#us').querySelectorAll('button,input'),a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}

  }
});

  var b=e.target.closest('[data-p]');if(!b)return;state.page=b.dataset.p;renderSidebar();renderMain();
});
$('#sb').addEventListener('mouseover',function(e){var b=e.target.closest('[data-tip]');b?showTip(b):hideTip()});
$('#sb').addEventListener('mouseleave',hideTip);
$('#sb').addEventListener('focusin',function(e){var b=e.target.closest('[data-tip]');if(b)showTip(b)});
$('#sb').addEventListener('focusout',hideTip);
$('#sb').addEventListener('scroll',hideTip,true);

renderQuick();renderAll();
</script>
</body>
</html>
